<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TriFix Demo Site</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>Broken Demo Landing Page</h1>
        <p>This page is intentionally flawed for AI testing.</p>
      </header>

      <section class="card">
        <h2>Newsletter Signup</h2>
        <form id="signup-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" />
          <button id="submit-btn" type="submit">Join</button>
        </form>
        <p id="message"></p>
      </section>

      <section class="card">
        <h2>Product Count</h2>
        <div id="count"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
